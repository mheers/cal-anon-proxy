name: dagger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.25"

      # pages/ imports __htmgo/assets, which htmgo generates at build time —
      # without this step vet/test fail on a fresh checkout.
      - name: Generate htmgo assets
        run: |
          mkdir -p __htmgo
          wget -q -O __htmgo/tailwind https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x __htmgo/tailwind
          go run github.com/maddalax/htmgo/cli/htmgo@latest build

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -race ./...

      - name: Install Dagger CLI
        run: cd /usr/local && { curl -L https://dl.dagger.io/dagger/install.sh | sh; cd -; }

      - name: Build Image
        working-directory: ci
        run: dagger call build-and-push-image --src ../ --registry-token=env:REGISTRY_ACCESS_TOKEN
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
