services:
  cal-anon-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: mheers/cal-anon-proxy:latest
    ports:
      - "3000:3000"
    environment:
      - "SRC_UPDATE_INTERVAL=${SRC_UPDATE_INTERVAL}"
      - "COMPACT_OVERLAPPING_EVENTS=${COMPACT_OVERLAPPING_EVENTS}"
      - "SRC_1_URL=${SRC_1_URL}"
      - "SRC_1_ANON=${SRC_1_ANON}"
      - "SRC_1_USERNAME=${SRC_1_USERNAME}"
      - "SRC_1_PASSWORD=${SRC_1_PASSWORD}"
      - "SRC_2_URL=${SRC_2_URL}"
      - "SRC_2_ANON=${SRC_2_ANON}"
      - "SRC_2_USERNAME=${SRC_2_USERNAME}"
      - "SRC_2_PASSWORD=${SRC_2_PASSWORD}"
      - "SRC_3_URL=${SRC_3_URL}"
      - "SRC_3_ANON=${SRC_3_ANON}"
      - "SRC_3_USERNAME=${SRC_3_USERNAME}"
      - "SRC_3_PASSWORD=${SRC_3_PASSWORD}"
      - "DST_AUTH_ENABLED=${DST_AUTH_ENABLED}"
      - "DST_USERNAME=${DST_USERNAME}"
      - "DST_PASSWORD=${DST_PASSWORD}"
      - "DST_PUBLIC_DOMAIN=${DST_PUBLIC_DOMAIN}"
      # Multitenancy: each TENANT_<N>_* block defines one tenant (see
      # .env.example). Copy a block for TENANT_3, TENANT_4, ... as needed.
      - "TENANT_1_NAME=${TENANT_1_NAME}"
      - "TENANT_1_WEBUI_ENABLED=${TENANT_1_WEBUI_ENABLED}"
      - "TENANT_1_SRC_1_URL=${TENANT_1_SRC_1_URL}"
      - "TENANT_1_SRC_1_ANON=${TENANT_1_SRC_1_ANON}"
      - "TENANT_1_SRC_1_USERNAME=${TENANT_1_SRC_1_USERNAME}"
      - "TENANT_1_SRC_1_PASSWORD=${TENANT_1_SRC_1_PASSWORD}"
      - "TENANT_1_SRC_2_URL=${TENANT_1_SRC_2_URL}"
      - "TENANT_1_SRC_2_ANON=${TENANT_1_SRC_2_ANON}"
      - "TENANT_1_SRC_2_USERNAME=${TENANT_1_SRC_2_USERNAME}"
      - "TENANT_1_SRC_2_PASSWORD=${TENANT_1_SRC_2_PASSWORD}"
      - "TENANT_1_SRC_3_URL=${TENANT_1_SRC_3_URL}"
      - "TENANT_1_SRC_3_ANON=${TENANT_1_SRC_3_ANON}"
      - "TENANT_1_SRC_3_USERNAME=${TENANT_1_SRC_3_USERNAME}"
      - "TENANT_1_SRC_3_PASSWORD=${TENANT_1_SRC_3_PASSWORD}"
      - "TENANT_1_SRC_4_URL=${TENANT_1_SRC_4_URL}"
      - "TENANT_1_SRC_4_ANON=${TENANT_1_SRC_4_ANON}"
      - "TENANT_1_SRC_4_USERNAME=${TENANT_1_SRC_4_USERNAME}"
      - "TENANT_1_SRC_4_PASSWORD=${TENANT_1_SRC_4_PASSWORD}"
      - "TENANT_1_DST_AUTH_ENABLED=${TENANT_1_DST_AUTH_ENABLED}"
      - "TENANT_1_DST_USERNAME=${TENANT_1_DST_USERNAME}"
      - "TENANT_1_DST_PASSWORD=${TENANT_1_DST_PASSWORD}"
      - "TENANT_2_NAME=${TENANT_2_NAME}"
      - "TENANT_2_WEBUI_ENABLED=${TENANT_2_WEBUI_ENABLED}"
      - "TENANT_2_SRC_1_URL=${TENANT_2_SRC_1_URL}"
      - "TENANT_2_SRC_1_ANON=${TENANT_2_SRC_1_ANON}"
      - "TENANT_2_SRC_1_USERNAME=${TENANT_2_SRC_1_USERNAME}"
      - "TENANT_2_SRC_1_PASSWORD=${TENANT_2_SRC_1_PASSWORD}"
      - "TENANT_2_SRC_2_URL=${TENANT_2_SRC_2_URL}"
      - "TENANT_2_SRC_2_ANON=${TENANT_2_SRC_2_ANON}"
      - "TENANT_2_SRC_2_USERNAME=${TENANT_2_SRC_2_USERNAME}"
      - "TENANT_2_SRC_2_PASSWORD=${TENANT_2_SRC_2_PASSWORD}"
      - "TENANT_2_SRC_3_URL=${TENANT_2_SRC_3_URL}"
      - "TENANT_2_SRC_3_ANON=${TENANT_2_SRC_3_ANON}"
      - "TENANT_2_SRC_3_USERNAME=${TENANT_2_SRC_3_USERNAME}"
      - "TENANT_2_SRC_3_PASSWORD=${TENANT_2_SRC_3_PASSWORD}"
      - "TENANT_2_SRC_4_URL=${TENANT_2_SRC_4_URL}"
      - "TENANT_2_SRC_4_ANON=${TENANT_2_SRC_4_ANON}"
      - "TENANT_2_SRC_4_USERNAME=${TENANT_2_SRC_4_USERNAME}"
      - "TENANT_2_SRC_4_PASSWORD=${TENANT_2_SRC_4_PASSWORD}"
      - "TENANT_2_DST_AUTH_ENABLED=${TENANT_2_DST_AUTH_ENABLED}"
      - "TENANT_2_DST_USERNAME=${TENANT_2_DST_USERNAME}"
      - "TENANT_2_DST_PASSWORD=${TENANT_2_DST_PASSWORD}"
      - "GOOGLE_AUTH_MODE=${GOOGLE_AUTH_MODE}"
      - "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
      - "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
      - "GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}"
      - "GOOGLE_SOURCE_CALENDAR_ID=${GOOGLE_SOURCE_CALENDAR_ID}"
      - "GOOGLE_DEST_CALENDAR_ID=${GOOGLE_DEST_CALENDAR_ID}"
      - "GOOGLE_SYNC_DAYS_PAST=${GOOGLE_SYNC_DAYS_PAST}"
      - "GOOGLE_SYNC_DAYS_FUTURE=${GOOGLE_SYNC_DAYS_FUTURE}"
      - "GOOGLE_SYNC_INTERVAL=${GOOGLE_SYNC_INTERVAL}"
      - "GOOGLE_WIPE_DESTINATION=${GOOGLE_WIPE_DESTINATION}"
      - "GOOGLE_ALLOW_EMPTY_SOURCE=${GOOGLE_ALLOW_EMPTY_SOURCE}"
      - "GOOGLE_DRY_RUN=${GOOGLE_DRY_RUN}"
